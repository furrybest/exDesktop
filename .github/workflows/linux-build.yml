name: Linux build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      config:
        description: 'Build Configuration (Release or Debug)'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: write

env:
  TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID || '27795979' }}
  TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH || '0b9b427e162605ce85210ab918a9c2d8' }}
  CONFIG: ${{ inputs.config || 'Release' }}

jobs:
  test:
    name: Test Plugin Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libpython3-dev

      - name: Run extera_plugins Linux Native Engine Test
        run: |
          ./build_linux.sh test

  build:
    name: Build Linux x86_64
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: |
            /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Generate Dockerfile
        run: |
          python3 -m pip install jinja2
          cd Telegram/build/docker/centos_env
          python3 gen_dockerfile.py > Dockerfile.rendered

      - name: Build and Cache Docker image
        uses: docker/build-push-action@v6
        with:
          context: Telegram/build/docker/centos_env
          file: Telegram/build/docker/centos_env/Dockerfile.rendered
          load: true
          tags: tdesktop:centos_env
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Update Docker cache
        run: |
          if [ -d /tmp/.buildx-cache-new ]; then
            rm -rf /tmp/.buildx-cache
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi

      - name: Build Telegram binary
        run: |
          ./build_linux.sh docker

      - name: Package Linux release
        run: |
          VERSION=$(grep -oP 'constexpr auto AppVersionStr = "\K[^"]+' Telegram/SourceFiles/core/version.h || echo "7.3.3.3")
          echo "BUILD_VERSION=${VERSION}" >> "$GITHUB_ENV"

          RELEASE_DIR="exDesktop-${VERSION}-linux-x64"
          mkdir -p "${RELEASE_DIR}/python/extera"

          # Find and copy output binary
          if [ -f out/Release/root/Telegram ]; then
            cp out/Release/root/Telegram "${RELEASE_DIR}/"
          elif [ -f out/bin/Telegram ]; then
            cp out/bin/Telegram "${RELEASE_DIR}/"
          else
            echo "Error: Telegram binary not found in out/Release/root/ or out/bin/" >&2
            exit 1
          fi

          if [ -f out/Release/root/Updater ]; then
            cp out/Release/root/Updater "${RELEASE_DIR}/"
          fi

          # Copy full python plugin runtime
          cp -r Telegram/SourceFiles/extera/python/* "${RELEASE_DIR}/python/extera/"

          chmod +x "${RELEASE_DIR}/Telegram"

          # Create distributable tarball and zip
          tar -cJf "exDesktop-linux-x64.${VERSION}.tar.xz" "${RELEASE_DIR}"
          zip -r "exDesktop-linux-x64.${VERSION}.zip" "${RELEASE_DIR}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: exDesktop-linux-x64
          path: |
            exDesktop-linux-x64.*.tar.xz
            exDesktop-linux-x64.*.zip

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" "exDesktop-linux-x64.${BUILD_VERSION}.tar.xz" "exDesktop-linux-x64.${BUILD_VERSION}.zip" --clobber
