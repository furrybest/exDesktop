name: Linux Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
    - name: Install git
      run: pacman -Syu --noconfirm --needed git

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Packages
      run: |
        pacman -Syu --noconfirm --needed \
          cmake ninja ccache python gperf nasm yasm rustup curl \
          qt6-base qt6-svg qt6-imageformats qt6-wayland qt6-5compat \
          kcoreaddons extra-cmake-modules glib2-devel glibmm-2.68 gobject-introspection \
          wayland-protocols plasma-wayland-protocols libxkbcommon \
          libxcomposite libxdamage libxrandr libxtst libxfixes libxrender xcb-util-keysyms \
          ffmpeg openal openh264 libvpx dav1d libavif libheif opus rnnoise hunspell xxhash lz4 minizip vulkan-headers \
          openssl zlib libjpeg-turbo pipewire libpulse alsa-lib \
          boost range-v3 fmt protobuf abseil-cpp libdispatch jemalloc

    - name: Download Portable Toolchain
      run: |
        curl -sSL https://github.com/prepkg/gcc-toolchain/releases/latest/download/gcc-x86_64-linux-gnu.tar.gz | tar xz -C /opt
        echo "/opt/x86_64-linux-gnu/bin" >> $GITHUB_PATH
        echo "CC=/opt/x86_64-linux-gnu/bin/x86_64-linux-gnu-gcc" >> $GITHUB_ENV
        echo "CXX=/opt/x86_64-linux-gnu/bin/x86_64-linux-gnu-g++" >> $GITHUB_ENV

    - name: Build Dependencies
      run: |
        set -e
        mkdir -p /tmp/deps && cd /tmp/deps
        export DEPS=/usr/local

        git clone -q -b v3.2.9 --depth=1 https://github.com/ada-url/ada.git
        cmake -S ada -B ada/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$DEPS" \
          -DADA_TESTING=OFF -DADA_TOOLS=OFF -DADA_INCLUDE_URL_PATTERN=OFF
        cmake --build ada/build && cmake --install ada/build

        git clone -q https://github.com/tdlib/td.git td
        cd td
        git fetch --depth=1 origin 51743dfd01dff6179e2d8f7095729caa4e2222e9
        git reset --hard FETCH_HEAD
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$DEPS" -DTD_E2E_ONLY=ON
        cmake --build build && cmake --install build

    - name: Configure
      env:
        API_ID: ${{ secrets.TDESKTOP_API_ID }}
        API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
      run: |
        if [ -n "$API_ID" ]; then
          creds=(-D TDESKTOP_API_ID="$API_ID" -D TDESKTOP_API_HASH="$API_HASH")
        else
          creds=(-D TDESKTOP_API_TEST=ON)
        fi
        cmake -B out -G Ninja "${creds[@]}" \
          -D CMAKE_BUILD_TYPE=Release \
          -D CMAKE_C_COMPILER="$CC" \
          -D CMAKE_CXX_COMPILER="$CXX" \
          -D CMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
          -D DESKTOP_APP_USE_PACKAGED=OFF

    - name: Build
      run: cmake --build out --target Telegram

    - name: Package
      run: |
        VERSION=$(grep -oP 'constexpr auto AppVersionStr = "\K[^"]+' Telegram/SourceFiles/core/version.h || echo "7.3.3.4")
        RELEASE_DIR="exDesktop-${VERSION}-linux-x64"
        mkdir -p "${RELEASE_DIR}/python/extera"
        
        if [ -f out/bin/Telegram ]; then
          cp out/bin/Telegram "${RELEASE_DIR}/"
        elif [ -f out/Release/root/Telegram ]; then
          cp out/Release/root/Telegram "${RELEASE_DIR}/"
        fi
        
        cp -r Telegram/SourceFiles/extera/python/* "${RELEASE_DIR}/python/extera/"
        chmod +x "${RELEASE_DIR}/Telegram"
        tar -cJf "exDesktop-linux-x64.${VERSION}.tar.xz" "${RELEASE_DIR}"

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: exDesktop-Linux-Build
        path: exDesktop-linux-x64.*.tar.xz
