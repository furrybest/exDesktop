name: Linux build (Arch, Static Libs)

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CONFIG: Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    env:
      DEPS: /opt/deps
      CCACHE_DIR: /root/.ccache
      CCACHE_MAXSIZE: 2G

    steps:
      - name: Install system packages
        run: |
          pacman -Syu --noconfirm --needed \
            git cmake ninja ccache python gperf nasm yasm rustup zip github-cli \
            qt6-base qt6-svg qt6-imageformats qt6-wayland qt6-5compat \
            kcoreaddons extra-cmake-modules glib2-devel glibmm-2.68 gobject-introspection \
            wayland-protocols plasma-wayland-protocols libxkbcommon \
            libxcomposite libxdamage libxrandr libxtst libxfixes libxrender xcb-util-keysyms \
            ffmpeg openal openh264 libvpx dav1d libavif libheif opus rnnoise hunspell xxhash lz4 minizip vulkan-headers \
            openssl zlib libjpeg-turbo pipewire libpulse alsa-lib \
            boost range-v3 fmt protobuf abseil-cpp libdispatch jemalloc

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore dependencies
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: /opt/deps
          key: linux-deps-v1-ada3.2.9-td51743df-owt07fb35b-rust1.96.1

      - name: Build dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p /tmp/deps && cd /tmp/deps
          fetch() { 
            git init -q "$3" && git -C "$3" remote add origin "https://github.com/$1.git"
            git -C "$3" fetch -q --depth=1 origin "$2" && git -C "$3" reset -q --hard FETCH_HEAD
          }
          git clone -q -b v3.2.9 --depth=1 https://github.com/ada-url/ada.git
          cmake -S ada -B ada/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$DEPS" \
            -DADA_TESTING=OFF -DADA_TOOLS=OFF -DADA_INCLUDE_URL_PATTERN=OFF
          cmake --build ada/build && cmake --install ada/build

          fetch tdlib/td 51743dfd01dff6179e2d8f7095729caa4e2222e9 td
          cmake -S td -B td/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$DEPS" -DTD_E2E_ONLY=ON
          cmake --build td/build && cmake --install td/build

          fetch desktop-app/tg_owt 07fb35bc33b3e79125a1beab7690e830f183f5d8 tg_owt
          git -C tg_owt submodule update -q --init --recursive --depth=1
          cmake -S tg_owt -B tg_owt/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$DEPS" \
            -DTG_OWT_DLOPEN_PIPEWIRE=ON
          cmake --build tg_owt/build && cmake --install tg_owt/build

          rustup default 1.96.1
          fetch desktop-app/patches a895fef40eaa7d66481cff542c623b039b7ce494 patches
          fetch dkaraush/tlottie 92df98dc209bc39b1e567ec74a8c86a0af5239de tlottie
          GIT_LFS_SKIP_SMUDGE=1 fetch i582/wallet-engine e59e0d89d7ee90c388bf36e3334c5b276f396697 wallet-engine
          git -C wallet-engine apply ../patches/wallet-engine.patch
          cargo new -q --lib --vcs none tdesktop_rust
          cd tdesktop_rust
          printf 'pub use ::tlottie;\npub use ::wallet_engine;\n' > src/lib.rs
          cargo add -q --path ../tlottie --features c-api
          cargo add -q --path ../wallet-engine
          cargo rustc --lib --release --crate-type staticlib --crate-type cdylib \
            --config "profile.release.opt-level=3" \
            --config "profile.release.lto='thin'" \
            --config "profile.release.codegen-units=1" \
            --config "profile.release.panic='unwind'"
          mkdir -p "$DEPS/lib" "$DEPS/include/tlottie" "$DEPS/include/wallet_engine"
          objcopy --strip-debug target/release/libtdesktop_rust.a "$DEPS/lib/libtdesktop_rust.a"
          cp ../tlottie/include/tlottie.h "$DEPS/include/tlottie/"
          cargo run --manifest-path ../wallet-engine/bindgen/cpp/bindgen/Cargo.toml --locked -- \
            --library --out-dir "$DEPS/include/wallet_engine" target/release/libtdesktop_rust.so

      - name: Save dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /root/.ccache
          key: linux-ccache-${{ github.run_id }}
          restore-keys: |
            linux-ccache-

      - name: Configure
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if [ -n "$API_ID" ]; then
            creds=(-D TDESKTOP_API_ID="$API_ID" -D TDESKTOP_API_HASH="$API_HASH")
          else
            echo "No API secrets, using TEST ONLY credentials"
            creds=(-D TDESKTOP_API_TEST=ON)
          fi
          cmake -B out -G Ninja "${creds[@]}" \
            -D CMAKE_BUILD_TYPE="$CONFIG" \
            -D CMAKE_PREFIX_PATH="$DEPS" \
            -D DESKTOP_APP_USE_PACKAGED=OFF \
            -D CMAKE_C_COMPILER_LAUNCHER=ccache \
            -D CMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build Telegram binary
        run: cmake --build out --target Telegram

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /root/.ccache
          key: linux-ccache-${{ github.run_id }}

      - name: Package Linux release
        run: |
          VERSION=$(grep -oP 'constexpr auto AppVersionStr = "\K[^"]+' Telegram/SourceFiles/core/version.h || echo "7.3.3.3")
          RELEASE_DIR="exDesktop-${VERSION}-linux-x64"
          mkdir -p "${RELEASE_DIR}/python/extera"
          mkdir -p "${RELEASE_DIR}/lib"

          if [ -f out/Release/root/Telegram ]; then
            cp out/Release/root/Telegram "${RELEASE_DIR}/"
          elif [ -f out/bin/Telegram ]; then
            cp out/bin/Telegram "${RELEASE_DIR}/"
          else
            echo "Error: Telegram binary not found" >&2
            exit 1
          fi

          ldd out/bin/Telegram | grep "=> /" | awk '{print $3}' | while read -r lib; do
            if [ -f "$lib" ]; then
              cp "$lib" "${RELEASE_DIR}/lib/"
            fi
          done

          cp -r Telegram/SourceFiles/extera/python/* "${RELEASE_DIR}/python/extera/"

          cat << 'EOF' > "${RELEASE_DIR}/run.sh"
          #!/bin/bash
          DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"
          export LD_LIBRARY_PATH="$DIR/lib:$LD_LIBRARY_PATH"
          exec "$DIR/Telegram" "$@"
          EOF
          chmod +x "${RELEASE_DIR}/run.sh"
          chmod +x "${RELEASE_DIR}/Telegram"

          tar -cJf "exDesktop-linux-x64.${VERSION}.tar.xz" "${RELEASE_DIR}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: exDesktop-linux-x64
          path: exDesktop-linux-x64.*.tar.xz

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" "exDesktop-linux-x64.${VERSION}.tar.xz" --clobber
